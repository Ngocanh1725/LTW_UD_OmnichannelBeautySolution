<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:1061px;background:#FFFFFF;" width="790px" height="1061px" viewBox="0 0 790 1061" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="1020.406" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="544.667">http://www.plantuml.com/plantuml/png/fLZlRzlM5Vskl-BCGXqPjMNBFs9RM8...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="565.305">http://www.plantuml.com/plantuml/png/~1fLZlRzlM5Vskl-BCGXqPjMNBFs9RM8...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="683.156">fLZlRzlM5Vskl-BCGXqPjMNBFs9RM8j996K9jYZPafqKC60yKxH8M7fKAJAfDnH86c35MXIhbnP5DWoB</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="646.174">wsPPkdHfaGv5HBJzG2F_n_jFjlj8IPITxCFg3uOaFjvtUUwvvvx7t_Gzvdf-juEopQt5Wzp1bk_mzi4U</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="672.157">umTbnYtwrpueE-oWrkNsGT5aldUI-fLdcLqJlGwpUQf_RFCUSraNXymuRhkEprkAqt5Sf4loBx6YPHun</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="667.769">l-EL7Exfh6jYgcbtpJvqypPsd2xZKwzUsx1_QoAtcBWOx-9oqyLQulU-nLhERPktSSGwVJDnfU2wpkqu</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="667.16">hrnnkRIwUFbYqxADOsxs-yXbLovV7AUHIrpgsDpqJdec7DUpd5Jg6jxwF_zIrt3ngGW-qilGDyeN_oX0</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="667.816">2Uygg9V33tJiXG_q3Uo5T-IQJojeldmcWY_r3LfR4S7lwzWJmLU_PFjKZnd7h6rYAfUbNGP_twKDQtde</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="699.474">vV0Eb5rz0ueOV5N7DAgx1PJ3E_h65D9QiRHIAk9tAG0mkMTx9vZIhV0X39-tOOZ1enxKbz-AuDn0LmGl</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="675.726">qBF4u4btdsUshjLSatLcKMT-XrthGx4Ssp2psUpC55WVkg8WhIvhrqiv6Tqr3O_nTiV4rCMdByyuBax5</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="666.019">u0SFLlYGjz7r6JBrsim-VnDAhO1ZMmJtkk1jonR1XrtwkMxPOl2p3oFydhTnA8BJP4PopteDwOAcqfRl</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="696.09">9p1PpA8fWi_q3MoMQt5HwcLPYWpzKgs8u8uElL3576wKvwhwp1JI9Qsqhgt6s2IoRr8QFN1B3BxXcCPc</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="733.182">bEh5gGW-vXOCImmUUUX8q7XxdsV62mO_T-6PNKevU3GBImpEE5hX2zwECDjMa2wfMb5Ta9k