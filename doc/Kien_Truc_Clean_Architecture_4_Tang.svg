 LAYER (Omnichannel.Infrastructure)</text></g><!--entity PresComp--><g class="entity" data-qualified-name="PresLayer.PresComp" id="ent0002" data-source-line="15"><rect x="107.47" y="39" width="429.066" height="89.844" fill="#D4E6F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="117.47" y="60.139" fill="#000" font-size="12" textLength="266.461" font-weight="700" font-family="'Times New Roman'">Các thành phần giao diện &amp; Điểm chạm</text><text x="117.47" y="74.107" fill="#000" font-size="12" textLength="409.066" font-family="'Times New Roman'">- 40 Bộ điều khiển (Storefront Controllers &amp; Admin Area Controllers)</text><text x="117.47" y="88.076" fill="#000" font-size="12" textLength="339.088" font-family="'Times New Roman'">- Giao diện Razor Views, ViewComponents, Partial Views</text><text x="117.47" y="102.045" fill="#000" font-size="12" textLength="354.404" font-family="'Times New Roman'">- Kênh thời gian thực SignalR Hubs (Realtime Notifications)</text><text x="117.47" y="116.014" fill="#000" font-size="12" textLength="394.33" font-family="'Times New Roman'">- Bộ lọc tùy biến (Action Filters, Exception &amp; Authorization Filters)</text></g><!--entity AppComp--><g class="entity" data-qualified-name="AppLayer.AppComp" id="ent0004" data-source-line="22"><rect x="22.67" y="432.69" width="588.652" height="89.844" fill="#FDEBD0" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="32.67" y="453.829" fill="#000" font-size="12" textLength="394.664" font-weight="700" font-family="'Times New Roman'">Các bản hợp đồng trừu tượng &amp; Điều phối luồng nghiệp vụ</text><text x="32.67" y="467.797" fill="#000" font-size="12" textLength="568.652" font-family="'Times New Roman'">- 25 Giao diện Dịch vụ (IOrderWorkflowService, IInventoryAllocationEngine, IPosShiftService...)</text><text x="32.67" y="481.766" fill="#000" font-size="12" textLength="479.736" font-family="'Times New Roman'">- 37 Bộ cấu trúc truyền tải dữ liệu (Data Transfer Objects - DTOs &amp; ViewModels)</text><text x="32.67" y="495.735" fill="#000" font-size="12" textLength="379.277" font-family="'Times New Roman'">- Bộ điều phối luồng ca sử dụng (Business Rules Orchestrators)</text><text x="32.67" y="509.704" fill="#000" font-size="12" textLength="427.887" font-family="'Times New Roman'">- Tiêu chuẩn quy tắc nghiệp vụ (Business Rule Specifications &amp; Enums)</text></g><!--entity DomainComp--><g class="entity" data-qualified-name="DomainLayer.DomainComp" id="ent0006" data-source-line="29"><rect x="234.07" y="629.54" width="587.861" height="89.844" fill="#D5F5E3" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="244.07" y="650.679" fill="#000" font-size="12" textLength="365.186" font-weight="700" font-family="'Times New Roman'">Lõi nghiệp vụ độc lập &amp; Bất biến (Zero Dependencies)</text><text x="244.07" y="664.647" fill="#000" font-size="12" textLength="567.861" font-family="'Times New Roman'">- 65 Thực thể thuần C# (POCO Entities: ProductBatches, StoreInventories, PosShifts, Orders...)</text><text x="244.07" y="678.616" fill="#000" font-size="12" textLength="516.697" font-family="'Times New Roman'">- Bất biến miền &amp; Logic nội tại (GetAvailableQuantity, IsNearExpiration, ValidatePrice)</text><text x="244.07" y="692.585" fill="#000" font-size="12" textLength="462.498" font-family="'Times New Roman'">- Định nghĩa sự kiện nội miền (Domain Events) &amp; Kiểu dữ liệu liệt kê (Enums)</text><text x="244.07" y="706.554" fill="#000" font-size="12" textLength="336.346" font-family="'Times New Roman'">- Cụm đối tượng tổng hợp (Aggregates &amp; Value Objects)</text></g><!--entity InfraComp--><g class="entity" data-qualified-name="InfraLayer.InfraComp" id="ent0008" data-source-line="36"><rect x="382.2" y="235.85" width="597.594" height="89.844" fill="#E8DAEF" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="392.2" y="256.989" fill="#000" font-size="12" textLength="324.398" font-weight="700" font-family="'Times New Rom